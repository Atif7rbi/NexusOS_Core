name: Accounting Phase 1 PostgreSQL

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/accounting-phase1-postgresql.yml'
  push:
    branches:
      - 'feat/accounting-foundations-ddl-v1'
      - 'feat/accounting-application-core-v1'
      - 'feat/accounting-api-v1'
      - 'feat/accounting-reporting-readiness-v1'
      - 'feat/receivables-foundations-v1'

jobs:
  postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nexusos_accounting_testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexusos_accounting_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_CONFIG_CACHE: /tmp/nexusos-accounting-config.php
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: nexusos_accounting_testing
      NEXUSOS_TEST_DATABASE: nexusos_accounting_testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      ACCOUNTING_RUNTIME_DB_ROLE: nexusos_runtime
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: PostgreSQL preflight
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:5432/nexusos_accounting_testing" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE nexusos_runtime LOGIN PASSWORD 'runtime-test-password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          SHOW server_version;
          SHOW default_transaction_isolation;
          SHOW lock_timeout;
          SHOW statement_timeout;
          SELECT current_database();
          SQL
      - run: php artisan migrate:fresh --force
      - name: Receivables Foundations focused tests
        run: php artisan test --filter='Receivables'
      - name: Accounting Phase 4 reporting reference tests
        run: php artisan test --filter='AccountingReportingQueriesTest'
      - name: Accounting Phase 3 API tests
        run: php artisan test --filter='Accounting.*Api'
      - name: Accounting Phase 2 focused tests
        run: php artisan test --filter='MoneyTest|AccountingApplication'
      - run: php artisan migrate:fresh --force && php artisan test --testsuite=Feature --filter='AccountingSchema|BusinessNumber|ProjectsApiTest|PostgreSqlConnectionTest'
      - name: Core feature regressions
        # Accounting concurrency tests are executed in the preceding focused
        # PostgreSQL steps. Their committed multi-process fixtures intentionally
        # cannot participate in Laravel's per-test transaction rollback.
        run: php artisan migrate:fresh --force && php artisan test --testsuite=Feature --filter='/^(?!.*Accounting(?:Schema|Application)ConcurrencyTest)/'
      - name: Migration rollback safety on empty schema
        run: |
          php artisan migrate:fresh --force
          php artisan migrate:rollback --step=7 --force
          psql "postgresql://postgres:postgres@127.0.0.1:5432/nexusos_accounting_testing" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('public.receivables') IS NOT NULL
               OR EXISTS(SELECT 1 FROM pg_constraint WHERE conname IN ('customers_tenant_id_id_unique','collections_tenant_id_id_unique'))
               OR to_regclass('public.accounting_source_types') IS NOT NULL
               OR to_regclass('public.accounting_settings') IS NOT NULL
               OR to_regclass('public.accounts') IS NOT NULL
               OR to_regclass('public.accounting_periods') IS NOT NULL
               OR to_regclass('public.journal_entries') IS NOT NULL
               OR to_regclass('public.journal_lines') IS NOT NULL
               OR to_regclass('public.opening_balance_operations') IS NOT NULL
               OR to_regclass('public.accounting_audits') IS NOT NULL
               OR to_regprocedure('public.validate_opening_balance_operation(character,character)') IS NOT NULL
            THEN
              RAISE EXCEPTION 'Receivables and Accounting migration stack was not fully rolled back';
            END IF;
          END $$;
          SQL
      - name: Backend formatting
        run: vendor/bin/pint --test app/Modules/Accounting app/Modules/Receivables database/migrations/2026_08_26_000000_create_receivables_table.php tests/Unit/Accounting tests/Feature/AccountingApplicationTest.php tests/Feature/AccountingApplicationStructureTest.php tests/Feature/AccountingApplicationConcurrencyTest.php tests/Feature/AccountingApiTestCase.php tests/Feature/AccountingSettingsAndAccountsApiTest.php tests/Feature/AccountingPeriodsApiTest.php tests/Feature/AccountingJournalsApiTest.php tests/Feature/AccountingOpeningBalanceApiTest.php tests/Feature/AccountingApiBoundaryTest.php tests/Feature/AccountingReportingQueriesTest.php tests/Feature/ReceivablesApiTest.php tests/Feature/ReceivablesSchemaIntegrityTest.php tests/Feature/ReceivablesConcurrencyTest.php tests/Support/accounting_application_worker.php tests/Support/receivables_worker.php
