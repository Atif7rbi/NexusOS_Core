name: Contract Consideration Source Integration

on:
  pull_request:
    paths:
      - 'backend/app/Modules/ContractConsideration/**'
      - 'backend/app/Modules/ContractualBilling/**'
      - 'backend/app/Modules/UnitHandover/**'
      - 'backend/tests/Feature/ContractConsiderationSourceIntegrationTest.php'
      - 'backend/tests/Support/CreatesContractConsiderationFixtures.php'
      - 'backend/database/migrations/2026_09_14_000000_create_contract_consideration_foundations.php'
      - 'docs/contract-consideration/**'
      - '.github/workflows/contract-consideration-source-integration.yml'
  push:
    branches:
      - 'feat/contract-consideration-source-integration-v1'

jobs:
  source-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nexusos_accounting_testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexusos_accounting_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_CONFIG_CACHE: /tmp/nexusos-accounting-config.php
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: nexusos_accounting_testing
      NEXUSOS_TEST_DATABASE: nexusos_accounting_testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      ACCOUNTING_RUNTIME_DB_ROLE: nexusos_runtime
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: PostgreSQL preflight
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:5432/nexusos_accounting_testing" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE nexusos_runtime LOGIN PASSWORD 'runtime-test-password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          SHOW server_version;
          SHOW default_transaction_isolation;
          SELECT current_database();
          SQL
      - name: Fresh PostgreSQL schema
        run: php artisan migrate:fresh --force
      - name: Phase 3B-2 source integration tests
        run: php artisan test --filter='ContractConsiderationSourceIntegrationTest'
      - name: Contract Consideration foundation regressions
        run: php artisan test --filter='/ContractConsideration(?:Adoption|SchemaIntegrity|Recovery|Concurrency)Test/'
      - name: Source workflow regressions
        run: php artisan test --filter='/ContractualBilling(?:EntitlementAndDraftCancellation|SourceCorrection)Test|UnitHandover(?:AcceptanceAction|ReversalAction)Test/'
      - name: Focused formatting
        env:
          COLUMNS: 300
        run: >-
          vendor/bin/pint --test
          app/Modules/ContractConsideration/Support/ContractConsiderationSourceCoordinator.php
          app/Modules/ContractualBilling/Actions/ActivateContractualBillingEntitlement.php
          app/Modules/ContractualBilling/Actions/CorrectFinalizedContractualBillingSchedule.php
          app/Modules/UnitHandover/Actions/CreateUnitHandoverAcceptance.php
          app/Modules/UnitHandover/Actions/ReverseUnitHandoverPerformanceSource.php
          tests/Feature/ContractConsiderationSourceIntegrationTest.php
          tests/Support/CreatesContractConsiderationFixtures.php
