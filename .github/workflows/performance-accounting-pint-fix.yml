name: Temporary Performance Accounting Pint Fix

on:
  push:
    branches:
      - feat/performance-accounting-recognition-v1

permissions:
  contents: write

jobs:
  pint-fix:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/performance-accounting-recognition-v1
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Format Slice 2 files
        run: |
          vendor/bin/pint \
            app/Modules/Accounting/Actions/ReverseJournalAction.php \
            app/Modules/AccountingRecognition/Actions/CorrectPerformanceAccounting.php \
            app/Modules/AccountingRecognition/Actions/RecognizePerformanceAccounting.php \
            app/Modules/AccountingRecognition/Support/AccountingRecognitionTransaction.php \
            app/Modules/AccountingRecognition/Support/PerformanceAccountingJournalWriter.php \
            app/Modules/AccountingRecognition/Support/PerformanceAccountingSourceCorrectionCoordinator.php \
            app/Modules/UnitHandover/Actions/ReverseUnitHandoverPerformanceSource.php \
            database/migrations/2026_09_19_000000_create_performance_accounting_recognitions.php \
            tests/Feature/AccountingRecognitionFoundationsTest.php \
            tests/Feature/PerformanceAccountingRecognitionConcurrencyTest.php \
            tests/Feature/PerformanceAccountingRecognitionSecurityTest.php \
            tests/Feature/PerformanceAccountingRecognitionTest.php \
            tests/Support/performance_accounting_worker.php
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/Modules/Accounting/Actions/ReverseJournalAction.php \
            app/Modules/AccountingRecognition/Actions/CorrectPerformanceAccounting.php \
            app/Modules/AccountingRecognition/Actions/RecognizePerformanceAccounting.php \
            app/Modules/AccountingRecognition/Support/AccountingRecognitionTransaction.php \
            app/Modules/AccountingRecognition/Support/PerformanceAccountingJournalWriter.php \
            app/Modules/AccountingRecognition/Support/PerformanceAccountingSourceCorrectionCoordinator.php \
            app/Modules/UnitHandover/Actions/ReverseUnitHandoverPerformanceSource.php \
            database/migrations/2026_09_19_000000_create_performance_accounting_recognitions.php \
            tests/Feature/AccountingRecognitionFoundationsTest.php \
            tests/Feature/PerformanceAccountingRecognitionConcurrencyTest.php \
            tests/Feature/PerformanceAccountingRecognitionSecurityTest.php \
            tests/Feature/PerformanceAccountingRecognitionTest.php \
            tests/Support/performance_accounting_worker.php
          git commit -m "style(accounting): format performance accounting slice two"
          git push origin HEAD:feat/performance-accounting-recognition-v1
